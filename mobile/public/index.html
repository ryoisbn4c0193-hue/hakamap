<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#249BD3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hakamap" />
    <meta name="description" content="Windows版から取り込んだ墓地配置図を端末内で参照します。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./hakamap-icon-180.png" />
    <link rel="license" href="./third-party-notices.txt" />
    <link rel="icon" type="image/png" href="./hakamap-icon-192.png" />
    <title>Hakamap</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #dff4fc;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      [aria-label^='墓地配置図'] {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      input,
      button {
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>Hakamapを使うにはJavaScriptを有効にしてください。</noscript>
    <div id="root"></div>
  </body>
</html>
